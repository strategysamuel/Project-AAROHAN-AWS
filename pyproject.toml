[tool.poetry]
name = "aarohan-backend"
version = "1.0.0"
description = "FastAPI backend services for Project AAROHAN MSME digital lending platform"
authors = ["Project AAROHAN Core Engineering Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
sqlalchemy = "^2.0.28"
asyncpg = "^0.29.0"
alembic = "^1.13.1"
google-cloud-secret-manager = "^2.19.0"
google-cloud-storage = "^2.15.0"
google-cloud-pubsub = "^2.20.0"
google-cloud-logging = "^3.9.0"
google-genai = "^0.1.1"
google-cloud-aiplatform = "^1.44.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.5"
black = "^24.2.0"
isort = "^5.13.2"
mypy = "^1.9.0"
ruff = "^0.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
