version: '3.8'

services:
  # 1. Seeder Init Container
  seeder-init:
    build:
      context: .
      dockerfile: Dockerfile
    command: python ese/seed/seed_all.py
    environment:
      - INTEGRATION_PROFILE=DEMO
      - ACTIVE_DATASET=msme
    volumes:
      - ./ese:/app/ese

  # 2. Onboarding Service
  onboarding-service:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 9001
    ports:
      - "9001:9001"
    environment:
      - INTEGRATION_PROFILE=DEMO
      - ACTIVE_DATASET=msme
      - PYTHONPATH=/app/services/ese-core:/app/services/onboarding-service
    volumes:
      - ./ese:/app/ese
    depends_on:
      seeder-init:
        condition: service_completed_successfully

  # 3. Consent Service
  consent-service:
