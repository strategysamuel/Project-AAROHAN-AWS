AWSTemplateFormatVersion: '2010-09-09'
Description: AAROHAN ECS Fargate networking stack with ALB, target groups, listener
  rules, and services.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-0baaf3e2126716d7b
    Description: Default VPC for the AAROHAN deployment.
  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0141a9891144668a6
    Description: Public subnet in one Availability Zone.
  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0b9376d5213679d1e
    Description: Public subnet in a different Availability Zone.
  PublicSubnet3:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0f673f54c411f4dca
    Description: Optional third public subnet for ECS services.
  ClusterName:
    Type: String
    Default: aarohan-hackathon-cluster
  IdentityTaskDefinition:
    Type: String
    Default: arn:aws:ecs:ap-south-1:905417996641:task-definition/identity-task-definition:1
    Description: Existing ECS task definition family or ARN for identity.
  LendingTaskDefinition:
    Type: String
    Default: arn:aws:ecs:ap-south-1:905417996641:task-definition/lending-task-definition:1
    Description: Existing ECS task definition family or ARN for lending.
  ExecutiveTaskDefinition:
    Type: String
    Default: arn:aws:ecs:ap-south-1:905417996641:task-definition/executive-task-definition:1
    Description: Existing ECS task definition family or ARN for executive.
Resources:
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AAROHAN ALB security group
      GroupName: aarohan-alb-sg
      VpcId: !Ref 'VpcId'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
      - IpProtocol: -1
        CidrIp: 0.0.0.0/0
  EcsIdentitySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AAROHAN ECS identity security group
      GroupName: aarohan-ecs-identity-sg
      VpcId: !Ref 'VpcId'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 9000
        ToPort: 9000
        SourceSecurityGroupId: !Ref 'AlbSecurityGroup'
      SecurityGroupEgress:
      - IpProtocol: -1
        CidrIp: 0.0.0.0/0
  EcsPlatformSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AAROHAN ECS platform security group
      GroupName: aarohan-ecs-platform-sg
      VpcId: !Ref 'VpcId'
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 9001
        ToPort: 9001
        SourceSecurityGroupId: !Ref 'AlbSecurityGroup'
      - IpProtocol: tcp
        FromPort: 9009
        ToPort: 9009
        SourceSecurityGroupId: !Ref 'AlbSecurityGroup'
      SecurityGroupEgress:
      - IpProtocol: -1
        CidrIp: 0.0.0.0/0
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: aarohan-alb
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
      - !Ref 'PublicSubnet1'
      - !Ref 'PublicSubnet2'
      SecurityGroups:
      - !Ref 'AlbSecurityGroup'
  IdentityTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 9000
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref 'VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200
  LendingTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref 'VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200
      HealthCheckPort: '80'
  EseAdminTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 9090
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref 'VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200
  RmWorkspaceTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 9010
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref 'VpcId'
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200

  EseAdminTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aarohan-eseadmin-tg
      Port: 9090
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200

  ConsentTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aarohan-consent-tg
      Port: 9002
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
