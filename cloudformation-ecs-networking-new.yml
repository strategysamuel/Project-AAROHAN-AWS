      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200

  CamTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aarohan-cam-tg
