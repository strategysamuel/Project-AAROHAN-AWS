      Port: 9005
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200

  CreditTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: aarohan-credit-tg
